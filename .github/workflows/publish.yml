name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @validkeys/contracted
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          # Do NOT set registry-url here — setup-node injects NODE_AUTH_TOKEN
          # when registry-url is set, which breaks OIDC authentication.

      - name: Upgrade npm and install pnpm 12
        # npm v11.5.1+ is required for OIDC publishing.
        # pnpm 10+ removes the --git-checks flag that npm v11 rejects.
        # We disable corepack and install pnpm 12 globally so it takes
        # precedence over the corepack shim (which would enforce pnpm 9).
        run: |
          npm install -g npm@latest
          corepack disable
          npm install -g pnpm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC — no token required)
        run: pnpm changeset publish
        # OIDC authentication is handled automatically by npm >= 11.5.1
        # when id-token: write is granted and a trusted publisher is
        # configured at https://www.npmjs.com/package/@validkeys/contracted
