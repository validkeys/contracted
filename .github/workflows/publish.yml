name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @validkeys/contracted
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          # Do NOT set registry-url here — setup-node injects NODE_AUTH_TOKEN
          # when registry-url is set, which interferes with OIDC authentication.

      - name: Upgrade npm (OIDC requires npm >= 11.5.1; stage publish requires npm >= 11.15.0)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Stage publish to npm (OIDC — no token required)
        # Submits the tarball to npm's staging area for maintainer review.
        # A maintainer must approve via `npm stage approve <id>` or npmjs.com
        # before the package goes live. This is the recommended security posture
        # for trusted publishing. OIDC authentication is automatic when
        # id-token: write is set and a trusted publisher is configured at
        # https://www.npmjs.com/package/@validkeys/contracted
        run: npm stage publish
        working-directory: .
