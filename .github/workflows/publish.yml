name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @validkeys/contracted
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Upgrade npm (OIDC requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Inspect OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          # Decode the payload (middle segment) without verifying signature
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys, base64, json
          s = sys.stdin.read().strip()
          # pad to multiple of 4
          s += '=' * (4 - len(s) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(s)), indent=2))
          ")
          echo "$PAYLOAD"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC — no token required)
        run: pnpm changeset publish
