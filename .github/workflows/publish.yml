name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @validkeys/contracted
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          # Do NOT set registry-url here — setup-node injects NODE_AUTH_TOKEN
          # when registry-url is set, which breaks OIDC authentication.

      - name: Upgrade npm (OIDC requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC — no token required)
        run: pnpm changeset publish --no-git-checks
        env:
          # npm v11 removed the --git-checks flag; this silences the warning
          # from older changeset versions that still pass it.
          NPM_CONFIG_GIT_CHECKS: 'false'
